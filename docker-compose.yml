name: pcforge
services:
  db:
    image: pcforge-db:local
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Debes crear .env con docker/scripts/Initialize-Env.ps1}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pcforge}
      MYSQL_USER: ${MYSQL_USER:-pcforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  backend:
    image: pcforge-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: PCForge
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Falta APP_KEY en .env}
      APP_URL: http://localhost:${API_PORT:-8000}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-pcforge}
      DB_USERNAME: ${MYSQL_USER:-pcforge}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_ALGO: HS256
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - laravel_storage:/var/www/html/storage
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((int)!is_resource(@fsockopen(\"127.0.0.1\",9000)));'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  nginx:
    image: pcforge-nginx:local
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/products"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: pcforge-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      API_BASE_URL: http://nginx/api
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 35s

volumes:
  mysql_data:
  laravel_storage:

networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
